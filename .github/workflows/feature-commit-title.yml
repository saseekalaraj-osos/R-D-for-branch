name: Auto squash commit title

# Sets the PR title used as the squash commit message when squash merging
# is set to "Pull request title".
#
# Feature branch feature/GSIS-8574-...
#   -> GSIS-8574-F12
#
# Bug branch bug/fix/GSIS-2875  (or bug/fix/GSIS-2875-description)
#   -> GSIS-2875-BUG-F12
#
# Bug linked to a story: bug/fix/GSIS-2875-GSIS-8574
#   -> GSIS-2875-BUG-F12-GSIS-8574
# Story id is optional (general bugs have no feature branch).
#
# Sequence F is global on base-v2.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - base-v2
  push:
    branches:
      - base-v2

concurrency:
  group: auto-squash-title-base-v2
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  set-squash-title:
    runs-on: ubuntu-latest
    steps:
      - name: Assign GSIS squash titles
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = 'base-v2';
            const titleRe =
              /^(GSIS-\d+)(?:-BUG)?-F(\d+)(?:-GSIS-\d+)?(?:\s*\(#\d+\))?$/i;
            const featureBranchRe = /(?:^|\/)feature\/(GSIS-\d+)/i;
            const bugBranchRe =
              /(?:^|\/)(?:bug\/fix|bugfix)\/(GSIS-\d+)(?:-(GSIS-\d+))?/i;
            const bugTitleRe =
              /^(GSIS-\d+)-BUG-F\d+(?:-(GSIS-\d+))?/i;
            const anyJiraRe = /(GSIS-\d+)/i;

            function ticketFrom(ref, fallbackTitle) {
              if (ref) {
                const bug = ref.match(bugBranchRe);
                if (bug) {
                  return {
                    kind: 'bug',
                    id: bug[1].toUpperCase(),
                    storyId: bug[2] ? bug[2].toUpperCase() : null
                  };
                }
                const feature = ref.match(featureBranchRe);
                if (feature) {
                  return {
                    kind: 'feature',
                    id: feature[1].toUpperCase(),
                    storyId: null
                  };
                }
              }

              const bugTitle = fallbackTitle && fallbackTitle.match(bugTitleRe);
              if (bugTitle) {
                return {
                  kind: 'bug',
                  id: bugTitle[1].toUpperCase(),
                  storyId: bugTitle[2] ? bugTitle[2].toUpperCase() : null
                };
              }

              const fromTitle =
                fallbackTitle && fallbackTitle.match(anyJiraRe);
              return fromTitle
                ? {
                    kind: 'feature',
                    id: fromTitle[1].toUpperCase(),
                    storyId: null
                  }
                : null;
            }

            function buildTitle(ticket, n) {
              if (ticket.kind === 'bug') {
                return ticket.storyId
                  ? `${ticket.id}-BUG-F${n}-${ticket.storyId}`
                  : `${ticket.id}-BUG-F${n}`;
              }
              return `${ticket.id}-F${n}`;
            }

            async function highestMergedFeatureNumber() {
              let highest = 0;
              for (let page = 1; page <= 50; page++) {
                const result = await github.rest.repos.listCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: baseBranch,
                  per_page: 100,
                  page
                });
                if (result.data.length === 0) {
                  break;
                }
                for (const commit of result.data) {
                  const title = commit.commit.message.split('\n')[0].trim();
                  const match = title.match(titleRe);
                  if (match) {
                    highest = Math.max(highest, Number(match[2]));
                  }
                }
                if (result.data.length < 100) {
                  break;
                }
              }
              return highest;
            }

            async function openPullRequests() {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: baseBranch,
                per_page: 100
              });
              return pulls
                .filter((pr) => !pr.draft)
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            }

            const mergedMax = await highestMergedFeatureNumber();
            const openPrs = await openPullRequests();
            let next = mergedMax + 1;
            const updated = [];

            for (const pr of openPrs) {
              const ticket = ticketFrom(pr.head.ref, pr.title);
              if (!ticket) {
                core.warning(
                  `PR #${pr.number} branch ${pr.head.ref} has no GSIS id; skipped.`
                );
                continue;
              }

              const nextTitle = buildTitle(ticket, next);
              next += 1;

              if (pr.title !== nextTitle) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  title: nextTitle
                });
              }
              updated.push(`#${pr.number} -> ${nextTitle}`);
            }

            if (updated.length === 0) {
              core.notice('No open PRs to retitle.');
              return;
            }

            core.notice(`Squash titles: ${updated.join(', ')}`);
